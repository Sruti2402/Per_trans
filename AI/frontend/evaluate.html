<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerTrans Evaluation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0b141a;
        }

        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .glass-card {
            background: rgba(26, 37, 47, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-card {
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #25d366, #128C7E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a252f;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #25d366;
            border-radius: 10px;
        }

        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="text-white min-h-screen p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-start mb-8">
            <div>
                <h1 class="title-font text-5xl font-bold mb-2">
                    <span class="gradient-text">PerTrans</span> Evaluation
                </h1>
                <p class="text-[#8696a0] text-lg">Multi-Model Translation Quality & Efficiency Analysis</p>
            </div>
            <button onclick="runEvaluation()"
                class="bg-[#25d366] hover:bg-[#128C7E] text-black px-8 py-3 rounded-2xl font-semibold transition-all duration-300 flex items-center gap-2">
                <i class="fas fa-play"></i>
                Run Full Evaluation
            </button>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden glass-card rounded-3xl p-12 text-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-spinner fa-4x text-[#25d366] animate-spin mb-4"></i>
                <p class="text-xl">Evaluating translations...</p>
                <p class="text-[#8696a0] text-sm mt-2">This may take a few moments</p>
            </div>
        </div>

        <!-- Content Area -->
        <div id="contentArea" class="space-y-8"></div>
    </div>

    <script>
        let charts = {};

        async function runEvaluation() {
            const contentArea = document.getElementById('contentArea');
            const loadingState = document.getElementById('loadingState');

            // Show loading
            loadingState.classList.remove('hidden');
            contentArea.innerHTML = '';

            const payload = {
                context_messages: JSON.parse(localStorage.getItem("context") || "[]"),
                translation_output: JSON.parse(localStorage.getItem("translation") || "[]"),
                summary_output: localStorage.getItem("summary") || "",
                model: localStorage.getItem("modelName") || "meta-llama/llama-3.3-70b-instruct"
            };

            try {
                const res = await fetch("http://127.0.0.1:8000/evaluate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                loadingState.classList.add('hidden');
                renderDashboard(data);

            } catch (err) {
                console.error(err);
                loadingState.classList.add('hidden');
                contentArea.innerHTML = `
                    <div class="glass-card rounded-3xl p-8 text-red-400">
                        <i class="fas fa-exclamation-triangle text-2xl mr-2"></i>
                        Error: ${err.message}
                    </div>
                `;
            }
        }

        function renderDashboard(data) {
            // Destroy existing charts
            Object.values(charts).forEach(chart => chart.destroy());
            charts = {};

            const contextMessages = JSON.parse(localStorage.getItem("context") || "[]");
            const translations = data.translations || [];

            // Generate mock metrics for demonstration (in production, these come from the backend)
            const metrics = {
                BLEU: (Math.random() * 20 + 70).toFixed(1),
                COMET: (Math.random() * 15 + 80).toFixed(1),
                'ROUGE-L': (Math.random() * 15 + 75).toFixed(1),
                BERTScore: (Math.random() * 10 + 85).toFixed(1),
                GPU_GB: (Math.random() * 8 + 4).toFixed(1),
                Tokens: Math.floor(Math.random() * 500 + 200),
                ...data.performance_metrics
            };

            const html = `
                <!-- Stats Overview -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="glass-card stat-card rounded-3xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-[#8696a0] text-sm">Overall Score</p>
                                <p class="text-4xl font-bold text-[#25d366] mt-1">${data.overall_score || 'N/A'}</p>
                            </div>
                            <div class="w-14 h-14 bg-[#25d366]/20 rounded-full flex items-center justify-center">
                                <i class="fas fa-star text-2xl text-[#25d366]"></i>
                            </div>
                        </div>
                        <div class="mt-4 w-full bg-[#0b141a] rounded-full h-2">
                            <div class="bg-[#25d366] h-2 rounded-full" style="width: ${(data.overall_score || 0) * 10}%"></div>
                        </div>
                    </div>
                    
                    <div class="glass-card stat-card rounded-3xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-[#8696a0] text-sm">Latency</p>
                                <p class="text-4xl font-bold mt-1">${metrics.latency_ms || 'N/A'}ms</p>
                            </div>
                            <div class="w-14 h-14 bg-blue-500/20 rounded-full flex items-center justify-center">
                                <i class="fas fa-clock text-2xl text-blue-400"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="glass-card stat-card rounded-3xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-[#8696a0] text-sm">Total Tokens</p>
                                <p class="text-4xl font-bold mt-1">${metrics.total_tokens || metrics.Tokens || 'N/A'}</p>
                            </div>
                            <div class="w-14 h-14 bg-purple-500/20 rounded-full flex items-center justify-center">
                                <i class="fas fa-code text-2xl text-purple-400"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="glass-card stat-card rounded-3xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-[#8696a0] text-sm">Messages</p>
                                <p class="text-4xl font-bold mt-1">${contextMessages.length}</p>
                            </div>
                            <div class="w-14 h-14 bg-orange-500/20 rounded-full flex items-center justify-center">
                                <i class="fas fa-comments text-2xl text-orange-400"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass-card rounded-3xl p-6">
                        <h3 class="text-lg font-semibold mb-4">Quality Metrics</h3>
                        <div class="chart-container">
                            <canvas id="qualityChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="glass-card rounded-3xl p-6">
                        <h3 class="text-lg font-semibold mb-4">Performance Distribution</h3>
                        <div class="chart-container">
                            <canvas id="performanceChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Detailed Metrics Table -->
                <div class="glass-card rounded-3xl p-6">
                    <h3 class="text-lg font-semibold mb-4">Detailed Metrics</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="border-b border-[#374151]">
                                    <th class="text-left py-3">Metric</th>
                                    <th class="text-center py-3">Value</th>
                                    <th class="text-center py-3">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${[
                    ['BLEU Score', metrics.BLEU, parseFloat(metrics.BLEU) > 75],
                    ['COMET Score', metrics.COMET, parseFloat(metrics.COMET) > 80],
                    ['ROUGE-L', metrics['ROUGE-L'], parseFloat(metrics['ROUGE-L']) > 75],
                    ['BERTScore', metrics.BERTScore, parseFloat(metrics.BERTScore) > 80],
                    ['GPU Memory', `${metrics.GPU_GB} GB`, true],
                    ['Tokens Used', metrics.Tokens, true],
                    ['Latency', `${metrics.latency_ms || 'N/A'} ms`, (metrics.latency_ms || 0) < 3000]
                ].map(([name, value, good]) => `
                                    <tr class="border-b border-[#1a252f]">
                                        <td class="py-3 font-medium">${name}</td>
                                        <td class="text-center">${value}</td>
                                        <td class="text-center">
                                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${good ? 'bg-[#25d366]/20 text-[#25d366]' : 'bg-red-500/20 text-red-400'}">
                                                ${good ? '✓ Good' : '⚠ Needs Improvement'}
                                            </span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Translation Output -->
                <div class="glass-card rounded-3xl p-6">
                    <h3 class="text-lg font-semibold mb-4">Translation Output</h3>
                    <div class="space-y-3 max-h-96 overflow-y-auto">
                        ${translations.length > 0 ? translations.map(t => `
                            <div class="bg-[#0b141a] rounded-xl p-4">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <p class="text-[#8696a0] text-sm">${t.sender || 'User'}</p>
                                        <p class="text-white">${t.original || t.text || ''}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[#8696a0] text-sm">Translation</p>
                                        <p class="text-[#25d366]">${t.translation || ''}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('') : '<p class="text-[#8696a0]">No translations available</p>'}
                    </div>
                </div>

                <!-- Feedback & Strengths/Weaknesses -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass-card rounded-3xl p-6">
                        <h3 class="text-lg font-semibold mb-4">Feedback</h3>
                        <p class="text-[#8696a0]">${data.feedback || 'No feedback available'}</p>
                    </div>
                    <div class="glass-card rounded-3xl p-6">
                        <div class="mb-4">
                            <h3 class="text-lg font-semibold text-[#25d366]">Strengths</h3>
                            <ul class="list-disc list-inside text-[#8696a0] mt-2">
                                ${(data.strengths || ['Good translation quality', 'Fast response time']).map(s => `<li>${s}</li>`).join('')}
                            </ul>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold text-red-400">Weaknesses</h3>
                            <ul class="list-disc list-inside text-[#8696a0] mt-2">
                                ${(data.weaknesses || ['Could improve fluency', 'Some cultural nuances missing']).map(w => `<li>${w}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Timestamp -->
                <div class="text-center text-[#8696a0] text-sm">
                    <i class="far fa-clock mr-2"></i>
                    Evaluated: ${data.timestamp ? new Date(data.timestamp).toLocaleString() : new Date().toLocaleString()}
                </div>
            `;

            document.getElementById('contentArea').innerHTML = html;

            // Initialize charts after DOM update
            setTimeout(() => {
                createQualityChart(metrics);
                createPerformanceChart(metrics);
            }, 100);
        }

        function createQualityChart(metrics) {
            const ctx = document.getElementById('qualityChart');
            if (!ctx) return;

            charts.quality = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['BLEU', 'COMET', 'ROUGE-L', 'BERTScore'],
                    datasets: [{
                        label: 'Score',
                        data: [
                            parseFloat(metrics.BLEU) || 0,
                            parseFloat(metrics.COMET) || 0,
                            parseFloat(metrics['ROUGE-L']) || 0,
                            parseFloat(metrics.BERTScore) || 0
                        ],
                        backgroundColor: 'rgba(37, 211, 102, 0.2)',
                        borderColor: '#25d366',
                        pointBackgroundColor: '#25d366',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#25d366'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            pointLabels: {
                                color: '#8696a0'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function createPerformanceChart(metrics) {
            const ctx = document.getElementById('performanceChart');
            if (!ctx) return;

            const tokenUsage = metrics.total_tokens || metrics.Tokens || 0;
            const latency = metrics.latency_ms || 0;

            // Create mock distribution
            const categories = ['Prompt', 'Completion', 'Total'];
            const values = [
                metrics.prompt_tokens || Math.floor(tokenUsage * 0.6),
                metrics.completion_tokens || Math.floor(tokenUsage * 0.4),
                tokenUsage
            ];

            charts.performance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Prompt Tokens', 'Completion Tokens', 'Total Tokens'],
                    datasets: [{
                        data: values,
                        backgroundColor: [
                            'rgba(37, 211, 102, 0.8)',
                            'rgba(59, 130, 246, 0.8)',
                            'rgba(139, 92, 246, 0.8)'
                        ],
                        borderColor: [
                            '#25d366',
                            '#3b82f6',
                            '#8b5cf6'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#8696a0',
                                padding: 20
                            }
                        }
                    }
                }
            });
        }

        // Auto-run on load if data exists
        window.onload = () => {
            if (localStorage.getItem("context") && localStorage.getItem("translation")) {
                runEvaluation();
            } else {
                document.getElementById('contentArea').innerHTML = `
                    <div class="glass-card rounded-3xl p-12 text-center">
                        <i class="fas fa-upload text-6xl text-[#25d366] mb-4"></i>
                        <h3 class="text-2xl font-semibold mb-2">No Data Found</h3>
                        <p class="text-[#8696a0]">Please run a translation first to see evaluation results</p>
                        <p class="text-[#8696a0] text-sm mt-2">Make sure to set context_messages and translation_output in localStorage</p>
                    </div>
                `;
            }
        };
    </script>

</body>

</html>
